<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HW1 Controle de Agenda</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #14213D;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    iframe {
      border: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #fff;
    }
    #fallback {
      display: none;
      position: fixed;
      inset: 0;
      background: #14213D;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      box-sizing: border-box;
    }
    #fallback.show { display: flex; }
    #fallback a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 20px;
      background: #FCA311;
      color: #14213D;
      font-weight: 700;
      text-decoration: none;
      border-radius: 8px;
    }
    #fallback p { margin: 0; max-width: 36em; line-height: 1.45; }
  </style>
</head>
<body>
  <iframe
    id="app"
    title="HW1 Controle de Agenda"
    allow="clipboard-write"
    referrerpolicy="no-referrer"
  ></iframe>
  <div id="fallback">
    <div>
      <p>Não foi possível abrir a agenda neste navegador com a conta Google logada. Abra em uma nova aba (a faixa azul do Google pode aparecer):</p>
      <a id="open-direct" href="#" target="_blank" rel="noopener">Abrir agenda</a>
    </div>
  </div>
  <script>
    var APP = 'https://script.google.com/a/*/macros/s/AKfycbzJtS08HrlATVrVXCg97PRfKYMYrrT3JV6JJTN593NsUyE85l0ClnMtmT8h_bS9WjIrpA/exec';
    var frame = document.getElementById('app');
    var fallback = document.getElementById('fallback');
    document.getElementById('open-direct').href = APP;

    function showFallback() {
      fallback.className = 'show';
    }

    try {
      frame.credentialless = true;
    } catch (err) {}

    frame.addEventListener('load', function () {
      try {
        if (frame.contentWindow && frame.contentWindow.length === 0) showFallback();
      } catch (err) {}
    });

    setTimeout(function () {
      try {
        if (frame.contentWindow && frame.contentWindow.length === 0) showFallback();
      } catch (err) {}
    }, 5000);

    frame.src = APP;
  </script>
</body>
</html>
